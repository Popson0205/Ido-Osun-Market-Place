<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Ido-Osun Market</title>
<link rel="icon" href="/icon-192.png">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2320;--mut:#66706a;--line:#e4e0d6;--brand:#1f6f4a;--brand-ink:#fff;--warn:#b7791f;--bad:#b42318;--ok:#1f6f4a}
@media(prefers-color-scheme:dark){:root{--bg:#121513;--card:#1a1e1b;--ink:#eceee9;--mut:#9aa39c;--line:#2b312d;--brand:#3fa675;--brand-ink:#08150e;--warn:#e0a84a;--bad:#f0746a;--ok:#3fa675}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 48px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;gap:12px;height:56px;padding-bottom:0}
header h1{font-size:16px;margin:0;flex:1}
header a{color:var(--mut);font-size:13px;text-decoration:none}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px}
button.p{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
button.d{color:var(--bad)}
button.sm{padding:5px 10px;font-size:13px}
button:disabled{opacity:.55;cursor:default}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.login{max-width:380px;margin:12vh auto 0}
.login h2{margin:0 0 4px}
.m{color:var(--mut);font-size:13px;margin:0}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat span{font-size:12px;color:var(--mut)}
.stat.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.tabs{display:flex;gap:6px;margin-top:20px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--mut)}
.tabs button.on{color:var(--ink);border-color:var(--brand);font-weight:600}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.row h3{margin:0;font-size:16px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin-left:8px;vertical-align:2px}
.tag.pending{color:var(--warn);border-color:var(--warn)}.tag.approved{color:var(--ok);border-color:var(--ok)}
.tag.rejected,.tag.suspended{color:var(--bad);border-color:var(--bad)}
.bar{display:flex;gap:8px;margin-top:16px}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:9}
.link{background:none;border:0;color:var(--brand);padding:0;text-decoration:underline}
</style>
</head>
<body>

<!-- Sign in -->
<main id="auth" class="wrap hide">
  <div class="card login">
    <h2 id="at">Admin sign in</h2>
    <p class="m" id="as">For the marketplace owner only.</p>
    <form id="af" autocomplete="on">
      <div id="nm" class="hide">
        <label for="fn">First name</label><input id="fn" autocomplete="given-name">
        <label for="ln">Last name</label><input id="ln" autocomplete="family-name">
      </div>
      <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
      <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" minlength="8" required>
      <div class="err" id="ae" role="alert"></div>
      <button class="p" id="ab" style="width:100%;margin-top:6px">Sign in</button>
    </form>
    <p class="m" style="margin-top:16px"><button class="link" id="sw">First time? Create the admin account</button></p>
    <p class="m" style="margin-top:8px"><a href="/" style="color:var(--mut)">&larr; Back to the marketplace</a></p>
  </div>
</main>

<!-- Dashboard -->
<div id="app" class="hide">
  <header><div class="wrap">
    <h1>Ido-Osun Market · Admin</h1>
    <a href="/" target="_blank" rel="noopener">View site</a>
    <button class="sm" id="out">Log out</button>
  </div></header>
  <main class="wrap">
    <div class="stats" id="stats"></div>
    <div class="tabs" id="tabs">
      <button data-t="stores" class="on">Stores</button>
      <button data-t="reports">Reports <span id="rc"></span></button>
      <button data-t="tools">Tools</button>
    </div>

    <section id="t-stores">
      <div class="bar"><input id="q" placeholder="Search stores, owners, categories…" aria-label="Search stores"></div>
      <div id="list"></div>
    </section>
    <section id="t-reports" class="hide"><div id="reports"></div></section>
    <section id="t-tools" class="hide">
      <div class="card"><h3 style="margin-top:0">Email (Brevo)</h3><p class="m" id="em-s"></p><div class="bar"><button class="sm" id="em-t">Send me a test email</button></div><p class="m" id="em-o" style="margin-top:10px;white-space:pre-wrap"></p></div>
      <div class="card"><h3 style="margin-top:0">Demo data</h3><p class="m" id="dm-s"></p>
        <div class="bar"><button class="sm" id="dm-l"></button><button class="sm d hide" id="dm-c">Remove demo data</button></div>
        <p class="m" id="dm-o" style="margin-top:10px"></p></div>
    </section>
  </main>
</div>

<div class="toast hide" id="toast" role="status"></div>

<script>
(function(){
var KEY="iom_admin_token",$=function(i){return document.getElementById(i)};
var tok=null,stores=[],filter="all",signup=false;
try{tok=localStorage.getItem(KEY)}catch(e){}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m){var t=$("toast");t.textContent=m;t.classList.remove("hide");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.add("hide")},3500)}
async function api(p,o){
  o=o||{};var h={"Content-Type":"application/json"};if(tok)h.Authorization="Bearer "+tok;
  var r=await fetch("/api"+p,{method:o.m||"GET",headers:h,body:o.b?JSON.stringify(o.b):undefined});
  var d=await r.json().catch(function(){return{}});
  if(r.status===401||(r.status===403&&tok)){if(tok){logout("Your session ended. Please sign in again.")}}
  if(!r.ok)throw new Error(d.error||"Something went wrong");
  return d;
}
function logout(msg){tok=null;try{localStorage.removeItem(KEY)}catch(e){}show(false);if(msg)$("ae").textContent=msg}
function show(on){$("app").classList.toggle("hide",!on);$("auth").classList.toggle("hide",on)}

/* ---- sign in / first-time account ---- */
$("sw").onclick=function(){
  signup=!signup;$("nm").classList.toggle("hide",!signup);$("fn").required=$("ln").required=signup;
  $("at").textContent=signup?"Create admin account":"Admin sign in";
  $("as").textContent=signup?"Use the exact email set as ADMIN_EMAIL on your server. Other emails will not get admin access.":"For the marketplace owner only.";
  $("ab").textContent=signup?"Create account":"Sign in";
  $("sw").textContent=signup?"Already have an account? Sign in":"First time? Create the admin account";
  $("ae").textContent="";
};
$("af").onsubmit=async function(e){
  e.preventDefault();$("ae").textContent="";$("ab").disabled=true;
  try{
    var email=$("em").value.trim(),pw=$("pw").value,r;
    r=signup?await api("/auth/register",{m:"POST",b:{first:$("fn").value.trim(),last:$("ln").value.trim(),email:email,password:pw}})
            :await api("/auth/login",{m:"POST",b:{email:email,password:pw}});
    if(r.user.role!=="admin"){
      $("ae").textContent=signup
        ?"Account created, but it is not an admin account because this email does not match ADMIN_EMAIL on your server."
        :"This account is not an admin. Check that its email matches ADMIN_EMAIL on your server.";
      return;
    }
    tok=r.token;try{localStorage.setItem(KEY,tok)}catch(x){}
    $("pw").value="";start();
  }catch(x){$("ae").textContent=x.message}
  finally{$("ab").disabled=false}
};
$("out").onclick=function(){logout()};

/* ---- tabs ---- */
$("tabs").onclick=function(e){
  var t=e.target.closest("button[data-t]");if(!t)return;
  [].forEach.call($("tabs").children,function(b){b.classList.toggle("on",b===t)});
  ["stores","reports","tools"].forEach(function(n){$("t-"+n).classList.toggle("hide",n!==t.dataset.t)});
};

/* ---- stores ---- */
function renderStats(){
  var c={all:stores.length,pending:0,approved:0,rejected:0,suspended:0};
  stores.forEach(function(s){c[s.status]=(c[s.status]||0)+1});
  $("stats").innerHTML=[["pending","Pending"],["approved","Approved"],["suspended","Suspended"],["rejected","Rejected"],["all","All stores"]].map(function(x){
    return '<button class="stat'+(filter===x[0]?" on":"")+'" data-f="'+x[0]+'"><b>'+(c[x[0]]||0)+'</b><span>'+x[1]+'</span></button>'}).join("");
}
$("stats").onclick=function(e){var b=e.target.closest("[data-f]");if(!b)return;filter=b.dataset.f;renderStats();renderList()};
$("q").oninput=renderList;
function renderList(){
  var q=$("q").value.trim().toLowerCase();
  var rows=stores.filter(function(s){
    return(filter==="all"||s.status===filter)&&(!q||(s.name+" "+s.category+" "+(s.location||"")+" "+s.email).toLowerCase().indexOf(q)>-1)});
  $("list").innerHTML=rows.map(function(s){
    var a=function(act,label,cls){return s.status===({approve:"approved",reject:"rejected",suspend:"suspended"})[act]?"":'<button class="sm '+(cls||"")+'" data-a="'+act+'-'+s.id+'">'+label+'</button>'};
    return '<div class="card"><div class="row"><div><h3>'+esc(s.name)+'<span class="tag '+esc(s.status)+'">'+esc(s.status)+'</span></h3>'
      +'<p class="m">'+esc(s.category)+(s.location?' · '+esc(s.location):'')+'<br>'+esc(s.email)+' · WhatsApp '+esc(s.whatsapp)+'</p></div>'
      +'<div class="acts">'+a("approve","Approve","p")+a("reject","Reject")+a("suspend","Suspend","d")+'</div></div></div>'}).join("")
    ||'<div class="card"><p class="m">No stores here.</p></div>';
}
$("list").onclick=async function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var p=b.dataset.a.split("-");
  if(p[0]!=="approve"&&!confirm(p[0]==="reject"?"Reject this store?":"Suspend this store? Its products will be hidden from customers."))return;
  b.disabled=true;
  try{await api("/admin/stores/"+p[1]+"/"+p[0],{m:"POST"});toast("Store "+({approve:"approved",reject:"rejected",suspend:"suspended"})[p[0]]);await loadStores();loadReports()}
  catch(x){toast(x.message);b.disabled=false}
};
async function loadStores(){stores=await api("/admin/stores");renderStats();renderList()}

/* ---- reports ---- */
async function loadReports(){
  var r=await api("/admin/reports");$("rc").textContent=r.length?"("+r.length+")":"";
  $("reports").innerHTML=r.map(function(x){
    return '<div class="card"><div class="row"><div><h3>'+esc(x.store_name)+'</h3><p class="m">'+esc(x.reason)+(x.details?": "+esc(x.details):"")+'</p></div>'
      +'<div class="acts"><button class="sm" data-r="'+x.id+'">Resolve</button><button class="sm d" data-s="'+x.store_id+'">Suspend store</button></div></div></div>'}).join("")
    ||'<div class="card"><p class="m">No open reports.</p></div>';
}
$("reports").onclick=async function(e){
  var b=e.target.closest("button");if(!b)return;b.disabled=true;
  try{
    if(b.dataset.r)await api("/admin/reports/"+b.dataset.r+"/resolve",{m:"POST"});
    else if(b.dataset.s){if(!confirm("Suspend this store?")){b.disabled=false;return}await api("/admin/stores/"+b.dataset.s+"/suspend",{m:"POST"});await loadStores()}
    await loadReports();
  }catch(x){toast(x.message);b.disabled=false}
};

/* ---- tools ---- */
async function loadTools(){
  var em=await api("/admin/email"),dm=await api("/admin/demo");
  $("em-s").textContent=em.enabled?("Sender: "+em.from+". "+(em.appUrl?"":" Also set APP_URL so emails link back to the site and password reset works.")):"Not set up. Add BREVO_API_KEY and MAIL_FROM on your host.";
  $("em-t").classList.toggle("hide",!em.enabled);
  $("dm-s").textContent=(dm.stores?dm.stores+" demo stores are loaded. ":"No demo data loaded. ")+"Sample vendors and products for presentations. Remove it before opening to the public.";
  $("dm-l").textContent=(dm.stores?"Reload":"Load")+" demo products";
  $("dm-c").classList.toggle("hide",!dm.stores);
}
$("em-t").onclick=async function(){this.disabled=true;var o=$("em-o");o.style.color="";o.textContent="Sending…";try{var r=await api("/admin/email/test",{m:"POST"});o.style.color="var(--ok)";o.textContent="Sent to "+r.to+". Check your inbox and spam folder."}catch(x){o.style.color="var(--bad)";o.textContent=x.message}this.disabled=false};
$("dm-l").onclick=async function(){
  var w=prompt("WhatsApp number that should receive demo orders (international format, no +)");if(!w)return;
  this.disabled=true;
  try{var r=await api("/admin/demo/load",{m:"POST",b:{whatsapp:w}});
    $("dm-o").textContent="Loaded "+r.stores+" stores and "+r.products+" products. Demo vendor login: "+r.login.email+" / "+r.login.password;
    await Promise.all([loadStores(),loadTools()])}
  catch(x){toast(x.message)}this.disabled=false};
$("dm-c").onclick=async function(){
  if(!confirm("Remove all demo stores and products?"))return;this.disabled=true;
  try{await api("/admin/demo/clear",{m:"POST"});$("dm-o").textContent="";await Promise.all([loadStores(),loadTools()])}
  catch(x){toast(x.message)}this.disabled=false};

/* ---- boot ---- */
async function start(){
  try{await Promise.all([loadStores(),loadReports(),loadTools()]);show(true)}
  catch(x){if(!tok)return;logout(x.message)}
}
if(tok){start()}else{show(false)}
})();
</script>
</body>
</html>
