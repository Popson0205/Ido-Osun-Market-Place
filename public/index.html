<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Ido-Osun Market</title>
<style>
:root{--bg:#f3f6f1;--card:#fff;--inp:#eef3ec;--ink:#1d2b24;--mute:#66766d;--g:#2f5d50;--gt:#fff;--acc:#f2711c;--chip:#e8f0e5;--line:#e1e9de;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121b16;--card:#1b2822;--inp:#26362e;--ink:#e9f1ec;--mute:#9db0a5;--g:#4f8f7b;--chip:#26362e;--line:#2c4037}}
:root[data-theme="dark"]{--bg:#121b16;--card:#1b2822;--inp:#26362e;--ink:#e9f1ec;--mute:#9db0a5;--g:#4f8f7b;--chip:#26362e;--line:#2c4037}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.brand{font-weight:800;font-size:1.1rem;text-decoration:none;color:#fff;margin-right:auto;white-space:nowrap}
.sf{order:5;flex:1 1 100%;display:flex;background:#fff;border-radius:12px;overflow:hidden}
.sf input{flex:1;border:0;padding:12px 14px;font-size:1rem;background:transparent;color:#1d2b24;min-width:0}
.sf button{border:0;background:var(--acc);color:#fff;padding:0 18px;font-size:1.1rem;cursor:pointer}
.ic{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:1.05rem;cursor:pointer;position:relative;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.ic b,.bn b{position:absolute;top:-3px;right:-3px;background:var(--acc);color:#fff;border-radius:999px;font-size:.68rem;padding:2px 6px;font-weight:700}
main{max-width:1100px;margin:0 auto;padding:12px 12px 24px;min-height:60vh}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
h1,h2{margin:0 0 6px}h1{font-size:1.35rem}h2{font-size:1.1rem}
.m{color:var(--mute)}
label{display:block;font-size:.9rem;margin:12px 0 6px}label i{color:#d33;font-style:normal}
input,select,textarea{width:100%;border:0;background:var(--inp);color:var(--ink);padding:13px;border-radius:12px;font-size:1rem;font-family:inherit}
.btn{display:block;width:100%;background:var(--g);color:var(--gt);border:0;border-radius:999px;padding:13px;font-size:1rem;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;margin-top:12px}
.btn.alt{background:var(--chip);color:var(--ink)}.btn.wa{background:#1fa855;color:#fff}
.btn.sm{padding:9px 14px;width:auto;display:inline-block;margin:4px 4px 0 0;font-size:.9rem}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 10px}.sh h1,.sh h2{margin:0}.sh a{color:var(--g);font-weight:600;text-decoration:none;font-size:.9rem}.sh select{width:auto;padding:9px 12px;font-size:.9rem}
.bnr{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:18px;scrollbar-width:none}.bnr::-webkit-scrollbar{display:none}
.bnr>div{flex:0 0 100%;scroll-snap-align:start;padding:26px 22px;color:#fff;min-height:160px}
.bnr h2{font-size:1.5rem;line-height:1.2;margin:0 0 8px}.bnr p{margin:0 0 12px;opacity:.95;max-width:420px}
.bnr .btn{background:#fff;color:#1d2b24;margin:0}
.s1{background:linear-gradient(120deg,#2f5d50,#4f9a7f)}.s2{background:linear-gradient(120deg,#e8590c,#f2a03d)}.s3{background:linear-gradient(120deg,#1f3a4d,#3b7a8c)}
.tr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tr div{background:var(--card);border-radius:14px;padding:10px;text-align:center;font-size:1.3rem}.tr b{display:block;font-size:.78rem;margin-top:2px}.tr span{display:none;font-size:.75rem;color:var(--mute)}
.cs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.cs::-webkit-scrollbar{display:none}
.cs a{flex:0 0 74px;text-align:center;text-decoration:none;font-size:.72rem}.cs i{display:flex;width:56px;height:56px;margin:0 auto 4px;border-radius:50%;background:var(--card);align-items:center;justify-content:center;font-size:1.6rem;font-style:normal;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.hs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}.hs>*{flex:0 0 156px}
.pc{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.im{display:flex;aspect-ratio:1/1;background:var(--inp);align-items:center;justify-content:center;font-size:2.8rem;position:relative;text-decoration:none;overflow:hidden}
.im img,.sl img,.pimg img,.th img{width:100%;height:100%;object-fit:cover;display:block}
.off{position:absolute;top:8px;left:8px;background:var(--acc);color:#fff;font-style:normal;font-size:.75rem;font-weight:700;padding:3px 7px;border-radius:8px}
.pb{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.pn{text-decoration:none;font-size:.9rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.pr{font-weight:800;font-size:1.02rem}.pr s{font-weight:400;font-size:.78rem;color:var(--mute);margin-left:4px}.pr.big{font-size:1.6rem;margin:6px 0}.price{color:var(--g);font-weight:800}
.ps{font-size:.76rem;color:var(--mute);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add{width:100%;margin-top:auto;border:0;border-radius:10px;background:var(--g);color:var(--gt);padding:9px;font-weight:600;cursor:pointer}
.st{display:flex;align-items:center;justify-content:space-between;background:var(--chip);border-radius:10px;padding:3px;margin-top:auto}.st span{font-weight:700}
.st button{width:34px;height:32px;border:0;border-radius:8px;background:var(--g);color:#fff;font-size:1.1rem;cursor:pointer}
.sc{flex:0 0 140px;background:var(--card);border-radius:14px;padding:12px;text-align:center;text-decoration:none;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:.85rem}
.sl{width:64px;height:64px;border-radius:50%;background:var(--inp);display:flex;align-items:center;justify-content:center;font-size:1.8rem;overflow:hidden;flex:none}.sl.big{width:84px;height:84px;font-size:2.4rem}
.sc .m{font-size:.72rem}.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.sgrid .sc{flex:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:.88rem;text-decoration:none;box-shadow:0 1px 6px rgba(0,0,0,.05)}.chip.on{background:var(--g);color:var(--gt)}
.tag{display:inline-block;background:var(--chip);border-radius:999px;padding:4px 12px;font-size:.8rem;margin:6px 6px 6px 0}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ct{background:var(--card);border-radius:16px;padding:16px 6px;text-align:center;text-decoration:none;font-size:.85rem}.ct i{display:block;font-size:2rem;font-style:normal;margin-bottom:6px}
.pd{display:grid;gap:16px}.pimg{aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:var(--inp);display:flex;align-items:center;justify-content:center;font-size:5rem;position:relative}
.back{background:none;border:0;color:var(--g);font-weight:600;font-size:.95rem;cursor:pointer;padding:6px 0}
.sh0{display:flex;gap:14px;align-items:center}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.th{width:56px;height:56px;border-radius:12px;background:var(--inp);display:flex;align-items:center;justify-content:center;font-size:1.6rem;overflow:hidden;flex:none}
.tog{display:flex;justify-content:space-between;align-items:center;background:var(--inp);padding:14px;border-radius:14px;margin-top:14px;gap:12px}.tog input{width:44px;height:24px;accent-color:var(--g)}
.sk .im,.sk .ln{background:linear-gradient(90deg,var(--inp),var(--chip),var(--inp));background-size:200% 100%;animation:sh 1.2s infinite}.sk .ln{height:12px;border-radius:6px;margin:6px 0}.sk .ln.s{width:60%}
@keyframes sh{to{background-position:-200% 0}}
.bn{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bn a{flex:1;text-align:center;padding:8px 0 6px;text-decoration:none;font-size:1.25rem;position:relative;color:var(--mute)}.bn a span{display:block;font-size:.68rem}.bn a.on{color:var(--g);font-weight:700}.bn b{top:2px;right:calc(50% - 26px)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1d2b24;color:#fff;padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap}#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}#toast a{color:#9be3c0;margin-left:8px;font-weight:700}
footer{background:#1d2b24;color:#e9f1ec;padding:20px;text-align:center;font-size:.85rem}footer a{color:#e9f1ec;margin:0 8px;display:inline-block;padding:4px 0;text-decoration:none}
.card ul{padding-left:20px;margin:6px 0}.card li{margin:4px 0}
.hide{display:none}#msg{color:var(--g);font-size:.9rem;margin:8px 0 0}
#ob{background:#f2a03d;color:#1d2b24;text-align:center;font-size:.85rem;padding:6px 12px}
.card ol{padding-left:22px;margin:6px 0}.card ol li{margin:8px 0}
@media (min-width:900px){.ist{display:none}}
@media (min-width:700px){.tr span{display:block}.cs a{flex:0 0 90px;font-size:.8rem}.hs>*{flex:0 0 190px}.sgrid{grid-template-columns:repeat(4,1fr)}.cgrid{grid-template-columns:repeat(5,1fr)}}
@media (min-width:900px){.top{flex-wrap:nowrap;padding-left:max(14px,calc((100% - 1100px)/2 + 12px));padding-right:max(14px,calc((100% - 1100px)/2 + 12px))}.sf{order:0;flex:1 1 auto;max-width:560px}.brand{margin-right:0}.top .ic:first-of-type{margin-left:auto}
.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.pd{grid-template-columns:420px 1fr}.bn{display:none}body{padding-bottom:0}#toast{bottom:24px}.bnr>div{min-height:220px;padding:44px}.bnr h2{font-size:2.1rem}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">🌿 Ido-Osun Market</a>
  <form class="sf" id="sf"><input id="sq" type="search" placeholder="Search products, vendors and categories" enterkeyhint="search"><button type="submit" aria-label="Search">🔍</button></form>
  <button class="ic" id="bt" type="button" title="Theme">🌙</button>
  <a class="ic" href="#/cart" id="bc" title="Cart">🛒<b id="cn" style="display:none">0</b></a>
  <a class="ic" href="#/me" id="ba" title="Account">👤<b id="ab" style="display:none">0</b></a>
</header>
<div id="ob" class="hide">📴 You are offline. Showing saved items, prices may be out of date.</div>
<main id="app"></main>
<input type="file" id="pf" accept="image/*" hidden>
<div id="toast"></div>
<footer><a href="#/about">About us</a><a href="#/safety">Safety tips</a><a href="#/faq">FAQ</a><a href="#/terms">Terms of service</a><a href="#/privacy">Privacy policy</a><a href="#/contact">Contact us</a><a href="#/install">Install guide</a><a id="fwa" href="#/contact" target="_blank" rel="noopener" class="hide">WhatsApp</a><a href="#" id="inst" class="hide">Install app</a><div style="margin-top:10px">© 2026 Ido-Osun Market · Launching with the Ido-Osun Digital Summit</div></footer>
<nav class="bn"><a href="#/" data-n="home">🏠<span>Home</span></a><a href="#/cats" data-n="cats">☰<span>Categories</span></a><a href="#/cart" data-n="cart">🛒<span>Cart</span><b id="cn2" style="display:none">0</b></a><a href="#/me" data-n="me">👤<span>Account</span></a></nav>
<script>
const CATS=[["Fresh Produce","🥬"],["Food","🍛"],["Fashion","👗"],["Electronics","📱"],["Home & Kitchen","🏠"],["Beauty & Care","💄"],["Beads & Crafts","📿"],["Pre-owned","♻️"],["Services","🔧"],["General","🛍️"]];
const EM=Object.fromEntries(CATS);
const $=i=>document.getElementById(i);
const ls=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const sv=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let tok=ls("t"),user=ls("u"),cart=ls("cart")||{},CFG={whatsapp:""},ip=null,pend=null,RID=0,bi,tt;
const PC={},SH={q:"",cat:"All",sort:"new",off:0,more:false},V={};
const ngn=x=>"₦"+Number(x).toLocaleString("en-NG");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opts=sel=>CATS.map(([c])=>`<option${c===sel?" selected":""}>${esc(c)}</option>`).join("");
async function api(p,o){o=o||{};const h={"Content-Type":"application/json"};if(tok)h.Authorization="Bearer "+tok;
  let r;try{r=await fetch("/api"+p,{method:o.m||"GET",headers:h,body:o.b?JSON.stringify(o.b):undefined})}catch(e){throw new Error(navigator.onLine===false?"You are offline. Check your connection and try again.":"Could not reach the server. Please try again.")}
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&tok){tok=null;user=null;sv("t");sv("u")}
  if(!r.ok)throw new Error(d.error||"Something went wrong");return d}
const fail=e=>{const m=$("msg");m?m.textContent=e.message:alert(e.message)};
const act=async fn=>{try{await fn()}catch(e){fail(e)}};
const toast=(m,l)=>{const t=$("toast");t.innerHTML=esc(m)+(l?` <a href="${l[1]}">${l[0]}</a>`:"");t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2600)};
const count=()=>{let n=0;for(const k in cart)n+=cart[k].q;$("cn").textContent=$("cn2").textContent=n;$("cn").style.display=$("cn2").style.display=n?"":"none"};
const saveCart=()=>{sv("cart",cart);count()};

/* ---------- building blocks ---------- */
const pct=p=>p.old_price>p.price?Math.round(100-p.price*100/p.old_price):0;
const img=(k,o,fb)=>o.img?`<img src="/img/${k}/${o.id}?v=${o.image_v}" alt="" loading="lazy">`:fb;
const stp=id=>{const c=cart[id];return c?`<div class="st"><button data-m="${id}" aria-label="Less">−</button><span>${c.q}</span><button data-pl="${id}" aria-label="More">+</button></div>`:`<button class="add" data-add="${id}">Add to cart</button>`};
const refresh=id=>document.querySelectorAll(`[data-act="${id}"]`).forEach(e=>e.innerHTML=stp(id));
function card(p){PC[p.id]=p;const d=pct(p);
  return `<div class="pc"><a href="#/p/${p.id}" class="im">${img("product",p,EM[p.category]||"🛍️")}${d?`<i class="off">-${d}%</i>`:""}</a><div class="pb"><a href="#/p/${p.id}" class="pn">${esc(p.name)}</a><div class="pr">${ngn(p.price)}${d?`<s>${ngn(p.old_price)}</s>`:""}</div><a class="ps" href="#/store/${p.store_id}">${esc(p.store_name)}</a><div data-act="${p.id}" style="margin-top:auto">${stp(p.id)}</div></div></div>`}
const scard=s=>`<a class="sc" href="#/store/${s.id}"><div class="sl">${img("store",s,EM[s.category]||"🛍️")}</div><b>${esc(s.name)}</b><span class="m">${esc(s.category)}<br>📍 ${esc(s.location||"Ido-Osun")}</span></a>`;
const sk=n=>`<div class="grid">${'<div class="pc sk"><div class="im"></div><div class="pb"><div class="ln"></div><div class="ln s"></div></div></div>'.repeat(n)}</div>`;
const banner=()=>`<div class="bnr" id="bnr"><div class="s1"><h2>Shop local.<br>Sell digital.</h2><p>Fresh produce, fashion, food and more from vendors in Ido-Osun.</p><a class="btn sm" href="#/shop">Start shopping</a></div><div class="s2"><h2>Open your free shop</h2><p>Add your products and receive orders straight on WhatsApp.</p><a class="btn sm" href="#/register">Become a vendor</a></div><div class="s3"><h2>Launching with the Ido-Osun Digital Summit</h2><p>Our first community digital marketplace.</p><a class="btn sm" href="#/about">Learn more</a></div></div>`;
const trust=()=>`<div class="tr"><div>📲<b>Order on WhatsApp</b><span>Chat and pay the vendor directly</span></div><div>🏪<b>Local vendors</b><span>Reviewed before they sell</span></div><div>🚩<b>Shop safely</b><span>Report anything suspicious</span></div></div>`;
const cats=()=>`<div class="cs">${CATS.map(([c,e])=>`<a href="#/shop/${encodeURIComponent(c)}"><i>${e}</i>${esc(c)}</a>`).join("")}</div>`;
const autoBanner=()=>{clearInterval(bi);if(!$("bnr"))return;bi=setInterval(()=>{const x=$("bnr");if(!x){clearInterval(bi);return}const w=x.clientWidth,n=Math.round(x.scrollLeft/w);x.scrollTo({left:((n+1)%x.children.length)*w,behavior:"smooth"})},5000)};

const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const installStrip=()=>standalone()||ls("hi")?"":`<div class="card ist" style="display:flex;align-items:center;gap:10px;padding:10px 14px"><span style="font-size:1.5rem">📲</span><div style="flex:1;font-size:.9rem"><b>Get the app</b><br><span class="m">Install for faster shopping.</span></div><a class="btn sm" href="#/install" style="margin:0">Install</a><button class="back" data-hi="1" aria-label="Dismiss">✕</button></div>`;
const rv=p=>{const l=(ls("rv")||[]).filter(x=>x.id!==p.id);l.unshift({id:p.id,name:p.name,price:p.price,old_price:p.old_price,img:p.img,image_v:p.image_v,store_id:p.store_id,store_name:p.store_name,category:p.category});sv("rv",l.slice(0,10))};
const rvRow=()=>{const l=ls("rv")||[];return l.length?`<div class="sh"><h2>Recently viewed</h2></div><div class="hs">${l.map(card).join("")}</div>`:""};

/* ---------- storefront views ---------- */
V.home=async()=>{
  const [nw,dl,st]=await Promise.all([api("/products?sort=new&limit=12"),api("/products?deals=1&limit=10"),api("/stores")]);
  return installStrip()+banner()+trust()+cats()+rvRow()+
  (dl.length?`<div class="sh"><h2>🔥 Deals</h2><a href="#/shop/deals">See all</a></div><div class="hs">${dl.map(card).join("")}</div>`:"")+
  (nw.length?`<div class="sh"><h2>Just in</h2><a href="#/shop">See all</a></div><div class="grid">${nw.map(card).join("")}</div>`:"")+
  (st.length?`<div class="sh"><h2>Local stores</h2><a href="#/stores">See all</a></div><div class="hs">${st.slice(0,10).map(scard).join("")}</div>`:"")+
  (nw.length||st.length?`<div class="card" style="text-align:center;margin-top:14px"><h2>Sell on Ido-Osun Market</h2><p class="m">Open your free online shop and get orders straight on WhatsApp.</p><a class="btn" href="#/register">Open your shop</a></div>`
   :`<div class="card" style="text-align:center;margin-top:14px"><h2>Vendors are joining soon</h2><p class="m">Be among the first to open a shop on Ido-Osun Market.</p><a class="btn" href="#/register">Become a vendor</a></div>`)};
const fetchP=async off=>{const u=new URLSearchParams({sort:SH.sort,limit:24,offset:off});if(SH.q)u.set("q",SH.q);if(SH.cat==="deals")u.set("deals","1");else if(SH.cat!=="All")u.set("cat",SH.cat);const r=await api("/products?"+u);SH.more=r.length===24;SH.off=off+r.length;return r};
const shopPage=async()=>{const r=await fetchP(0),title=SH.q?`Results for “${esc(SH.q)}”`:SH.cat==="deals"?"🔥 Deals":SH.cat==="All"?"All products":esc(SH.cat);
  const so=(v,l)=>`<option value="${v}"${SH.sort===v?" selected":""}>${l}</option>`;
  return `<div class="sh"><h1>${title}</h1><select id="so">${so("new","Newest")}${so("price_asc","Price: low to high")}${so("price_desc","Price: high to low")}</select></div><div class="chips">${[["All","🛒"],["deals","🔥"]].concat(CATS).map(([c,e])=>`<a class="chip${!SH.q&&c===SH.cat?" on":""}" href="#/shop/${encodeURIComponent(c)}">${e} ${c==="deals"?"Deals":esc(c)}</a>`).join("")}</div>`+
  (r.length?`<div class="grid" id="pg">${r.map(card).join("")}</div>${SH.more?'<button class="btn alt" data-more="1">Load more</button>':""}`:`<div class="card" style="text-align:center"><p class="m">No products found.</p><a class="btn" href="#/shop">Browse all products</a></div>`)};
V.shop=async a=>{SH.cat=a?decodeURIComponent(a):"All";SH.q="";return shopPage()};
V.search=async a=>{SH.q=decodeURIComponent(a||"");SH.cat="All";return shopPage()};

const b64=s=>{const r=(s+"=".repeat((4-s.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/"),a=atob(r);return Uint8Array.from(a,c=>c.charCodeAt(0))};
const pushOK=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
async function initPush(){const el=$("pc");if(!el)return;
  let key=null;try{key=(await api("/push/key")).key}catch(e){}
  if(!key)return;
  if(!pushOK()){el.classList.remove("hide");el.innerHTML='<h2>🔔 Order notifications</h2><p class="m">To get a phone notification for every new order, install this app on your home screen and open it from there. On iPhone: Safari, Share, Add to Home Screen. See the <a href="#/install"><b>install guide</b></a>.</p>';return}
  const reg=await Promise.race([navigator.serviceWorker.ready,new Promise(r=>setTimeout(()=>r(null),4000))]);
  if(!reg)return;const sub=await reg.pushManager.getSubscription();
  el.classList.remove("hide");
  el.innerHTML=`<h2>🔔 Order notifications</h2><p class="m">${sub?"This phone gets a notification for every new order.":"Get a notification on this phone when a customer places an order."}</p><button class="btn${sub?" alt":""}" data-push="1">${sub?"Turn off notifications":"Turn on notifications"}</button>`}
async function pushToggle(){const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
  if(sub){await api("/vendor/push/unsubscribe",{m:"POST",b:{endpoint:sub.endpoint}});await sub.unsubscribe();return false}
  const {key}=await api("/push/key");if(!key)throw new Error("Notifications are not set up yet.");
  if(await Notification.requestPermission()!=="granted")throw new Error("Notifications are blocked. Allow them in your browser or phone settings.");
  sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(key)});
  await api("/vendor/push/subscribe",{m:"POST",b:sub.toJSON()});return true}

function shrink(f,max){return new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b&&b.size<400000?ok(b):no(new Error("Photo is too large. Try a smaller one.")),"image/jpeg",0.8)};i.onerror=()=>no(new Error("Could not read that photo. Try a JPEG or PNG."));i.src=u})}

  const r=await fetch("/api"+u,{method:"PUT",headers:{"Content-Type":"image/jpeg",Authorization:"Bearer "+tok},body:b}),d=await r.json().catch(()=>({}));

    if(d.demo==="clear"){if(!confirm("Remove all demo stores and products?"))return;await api("/admin/demo/clear",{m:"POST"});route();return}
    const w=prompt("WhatsApp number that should receive demo orders (international format, no +)",CFG.whatsapp||"");if(!w)return;
    const r=await api("/admin/demo/load",{m:"POST",b:{whatsapp:w}});
    alert("Demo data loaded: "+r.stores+" stores, "+r.products+" products.\n\nDemo vendor login (to show the dashboard):\n"+r.login.email+"\nPassword: "+r.login.password);route()});
  if(d.ad)act(async()=>{const a=d.ad.split("-");await api("/admin/stores/"+a[1]+"/"+a[0],{m:"POST"});route()});
  if(t.id==="out"){tok=user=null;sv("t");sv("u");location.hash="#/"}
  if(t.id==="go")act(async()=>{
    if($("le"))return login(await api("/auth/login",{m:"POST",b:{email:$("le").value,password:$("lp").value}}));
    const b={first:$("fn").value,last:$("ln").value,email:$("re").value,password:$("rp").value,referral:$("rc").value};
    if($("vt").checked)b.vendor={shop:$("vn").value,whatsapp:$("vw").value,category:$("vc").value,location:$("vl").value};
    login(await api("/auth/register",{m:"POST",b}))});
  if(t.id==="ss")act(async()=>{await api("/vendor/store",{m:"PUT",b:{name:$("sn").value,description:$("sd").value,category:$("sc").value,location:$("sl").value,whatsapp:$("sw").value}});$("msg").textContent="Saved ✓"});
  if(t.id==="ap")act(async()=>{await api("/vendor/products",{m:"POST",b:{name:$("pn").value,price:$("pp").value,old_price:$("po").value,description:$("pd").value}});route()});
  if(d.ep)act(async()=>{const p=prompt("New price in ₦",d.pr);if(p===null)return;await api("/vendor/products/"+d.ep,{m:"PUT",b:{price:p}});route()});
  if(d.ed)act(async()=>{const o=prompt("Old price in ₦ (leave empty for none)",d.op);if(o===null)return;const ds=prompt("Short description",d.ds);if(ds===null)return;await api("/vendor/products/"+d.ed,{m:"PUT",b:{old_price:o===""?null:o,description:ds}});route()});
  if(d.tp)act(async()=>{await api("/vendor/products/"+d.tp,{m:"PUT",b:{active:d.a!=="true"}});route()});
  if(d.dp&&confirm("Delete this product?"))act(async()=>{await api("/vendor/products/"+d.dp,{m:"DELETE"});route()});
  if(d.ph){pend=d.ph;$("pf").value="";$("pf").click()}
});

document.addEventListener("change",e=>{if(e.target.id==="so"){SH.sort=e.target.value;route()}});
$("sf").onsubmit=e=>{e.preventDefault();const v=$("sq").value.trim();if(v)location.hash="#/search/"+encodeURIComponent(v)};
$("bt").onclick=()=>{const r=document.documentElement,d=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);r.setAttribute("data-theme",d?"light":"dark")};
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;$("inst").classList.remove("hide")});
$("inst").onclick=e=>{e.preventDefault();if(ip){ip.prompt();ip=null;$("inst").classList.add("hide")}};
const net=()=>$("ob").classList.toggle("hide",navigator.onLine!==false);
addEventListener("offline",net);addEventListener("online",()=>{net();if(["","home","shop","search","store","p","stores"].includes(location.hash.replace("#/","").split("/")[0]))route()});
window.addEventListener("hashchange",route);count();net();
api("/config").then(c=>{CFG=c;if(c.whatsapp){const f=$("fwa");f.href="https://wa.me/"+c.whatsapp;f.classList.remove("hide")}}).catch(()=>{}).then(route);
setInterval(poll,60000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
